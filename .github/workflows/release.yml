name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to (re)build, e.g. v0.1.0
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Select newest Xcode
        run: |
          XCODE="$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Build universal app (ad-hoc signed)
        run: UNIVERSAL=1 scripts/bundle.sh release

      - name: Package
        run: scripts/package.sh "$TAG"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/*.zip dist/*.sha256 --clobber
          else
            gh release create "$TAG" dist/*.zip dist/*.sha256 --title "Rondo ${TAG#v}" --notes-file dist/notes.md
          fi

      # Needs repo secret TAP_TOKEN: fine-grained token, FarazBukhari/homebrew-tap only, Contents read/write.
      - name: Bump Homebrew cask
        env:
          TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
        run: |
          if [[ -z "$TAP_TOKEN" ]]; then
            echo "::notice::TAP_TOKEN not set; skipping Homebrew cask bump"
            exit 0
          fi
          VERSION="${TAG#v}"
          SHA="$(cut -d' ' -f1 "dist/Rondo-$VERSION.zip.sha256")"
          git clone --depth 1 "https://x-access-token:${TAP_TOKEN}@github.com/FarazBukhari/homebrew-tap.git" tap
          cd tap
          CURRENT="$(sed -nE 's/^  version "(.*)"/\1/p' Casks/rondo.rb)"
          if [[ "$(printf '%s\n%s\n' "$CURRENT" "$VERSION" | sort -V | tail -1)" != "$VERSION" ]]; then
            echo "::notice::Tap is at $CURRENT, newer than $VERSION; not downgrading"
            exit 0
          fi
          sed -i '' -E "s/^  version \".*\"/  version \"$VERSION\"/; s/^  sha256 \".*\"/  sha256 \"$SHA\"/" Casks/rondo.rb
          if git diff --quiet; then
            echo "Cask already at $VERSION"
            exit 0
          fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -am "rondo $VERSION"
          git push origin HEAD:main
